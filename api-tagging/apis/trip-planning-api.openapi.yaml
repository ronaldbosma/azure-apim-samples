openapi: 3.0.3
info:
  title: Trip Planning API
  version: 1.0.0
paths:
  /routes/search:
    get:
      operationId: searchRoutes
      summary: Search candidate routes
      tags:
        - planning
        - public
      responses:
        "200":
          description: OK
  /routes/fare:
    get:
      operationId: getRouteFare
      summary: Get route fare estimate
      tags:
        - pricing
        - public
      responses:
        "200":
          description: OK
  /routes/alerts:
    get:
      operationId: getRouteAlerts
      summary: List route alerts
      tags:
        - planning
        - public
      responses:
        "200":
          description: OK
