openapi: 3.0.1
info:
  title: Backend
  description: Backend API
  version: '1.0'
paths:
  /{statusCode}:
    get:
      summary: Get response with specified status code
      description: Returns a response with the specified HTTP status code
      operationId: get-response-by-status-code
      parameters:
        - name: statusCode
          in: path
          required: true
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: The HTTP status code to return
      responses:
        default:
          description: Response with requested status code
