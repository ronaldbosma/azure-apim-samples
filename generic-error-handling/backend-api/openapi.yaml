openapi: 3.0.1
info:
  title: Backend
  description: Backend API
  version: '1.0'
paths:
  /{statusCode}:
    get:
      summary: Get response with specified status code
      description: Returns a response with the specified HTTP status code
      operationId: getResponseByStatusCode
      parameters:
        - name: statusCode
          in: path
          required: true
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: The HTTP status code to return
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
        '400':
          description: Bad request - invalid status code
        '500':
          description: Internal server error

components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: []
  - apiKeyQuery: []