openapi: 3.0.1
info:
  title: Frontend
  description: Frontend API that forwards requests to the Backend API
  version: '1.0'
paths:
  /default-behaviour/{statusCode}:
    get:
      summary: Default Behaviour
      description: |
        Status codes 404, 409, 413, 429 from the backend are returned as is,
        all other status codes are converted into a 500.
      operationId: default-behaviour
      parameters:
        - name: statusCode
          in: path
          required: true
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: The HTTP status code to return
      responses:
        '200':
          description: Success
        '201':
          description: Created
        '204':
          description: No content
        '404':
          description: Not found
        '409':
          description: Conflict
        '413':
          description: Payload too large
        '429':
          description: Too many requests
        '500':
          description: Internal server error
  /error-handled/{statusCode}:
    get:
      summary: Error Handled
      description: |
        There is no custom error handling in the operation. 
        All status codes are returned as is.
      operationId: error-handled
      parameters:
        - name: statusCode
          in: path
          required: true
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: The HTTP status code to return
      responses:
        '200':
          description: Success
        '201':
          description: Created
        '204':
          description: No content
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '409':
          description: Conflict
        '413':
          description: Payload too large
        '429':
          description: Too many requests
        '500':
          description: Internal server error
        '501':
          description: Not implemented
        '502':
          description: Bad gateway
        '503':
          description: Service unavailable
  /custom-error-handling/{statusCode}:
    get:
      summary: Custom Error Handling
      description: |
        - A 201 is turned into a 418. Because we don't set error-handled to true, this should be turned into a 500 by the global error handling.
        - A 204 is turned into a 418. Because we set error-handled to true, the global error handling is skipped and it is returned as is.
        - For all other responses, the default is applied.
      operationId: custom-error-handling
      parameters:
        - name: statusCode
          in: path
          required: true
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: The HTTP status code to return
      responses:
        '200':
          description: Success
        '404':
          description: Not found
        '409':
          description: Conflict
        '413':
          description: Payload too large
        '418':
          description: I'm a teapot
        '429':
          description: Too many requests
        '500':
          description: Internal server error
  /override-passthrough-error-codes/{statusCode}:
    get:
      summary: Override Passthrough Error Codes
      description: |
        The operation overrides the error status codes to passthrough,
        which means status codes 401, 403, 404, 503 from the backend are returned as is,
        all other status codes are converted into a 500.
      operationId: override-passthrough-error-codes
      parameters:
        - name: statusCode
          in: path
          required: true
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: The HTTP status code to return
      responses:
        '200':
          description: Success
        '201':
          description: Created
        '204':
          description: No content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '500':
          description: Internal server error
        '503':
          description: Service unavailable
