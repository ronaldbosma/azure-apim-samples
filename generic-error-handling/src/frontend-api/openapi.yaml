openapi: 3.0.1
info:
  title: Frontend
  description: Frontend API that forwards requests to the Backend API
  version: '1.0'
paths:
  /default-behaviour/{statusCode}:
    get:
      summary: Default Behaviour
      description: Returns a response based on the specified HTTP status code to demonstrate default error handling behaviour.
      operationId: default-behaviour
      parameters:
        - name: statusCode
          in: path
          required: true
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: The HTTP status code to return
      responses:
        '200':
          description: Success
        '201':
          description: Created
        '204':
          description: No content
        '404':
          description: Not found
        '409':
          description: Conflict
        '413':
          description: Payload too large
        '429':
          description: Too many requests
        '500':
          description: Internal server error
  /error-handled/{statusCode}:
    get:
      summary: Error Handled
      description: Returns a response based on the specified HTTP status code to demonstrate error handling behaviour where the operation specifies it handled the error.
      operationId: error-handled
      parameters:
        - name: statusCode
          in: path
          required: true
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: The HTTP status code to return
      responses:
        default:
          description: Response with requested status code
